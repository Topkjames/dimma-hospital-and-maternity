        q.includes('fainted') || q.includes('unconscious') || q.includes('water break') || 
        q.includes('leaking') || q.includes('severe pain') || q.includes('not kicking') || 
        q.includes('no movement') || q.includes('emergency') || q.includes('breathing') ||

          type: 'emergency',

    function App() {
      const [theme, setTheme] = useState(() => {
        return localStorage.getItem('dimma_theme') || 'light';
      });

      const [currentPage, setCurrentPage] = useState('home');
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
      const [selectedServiceModal, setSelectedServiceModal] = useState(null);
      const [selectedArticle, setSelectedArticle] = useState(null);

      const [isChatOpen, setIsChatOpen] = useState(false);
      const [chatInput, setChatInput] = useState('');
      const [chatMessages, setChatMessages] = useState([
        {
          id: 'welcome',
          sender: 'bot',
          text: `Hello and welcome to **DIMMA Hospital & Maternity**! 🏥\n\nI am your AI Healthcare & Hospital Guide. How may I assist you with your health, maternity care, or hospital visit in Enugu today?`,
          time: 'Just now'
        }
      ]);
      const [isBotTyping, setIsBotTyping] = useState(false);
      const chatEndRef = useRef(null);

      useEffect(() => {
        const root = document.documentElement;
        if (theme === 'dark') {
          root.classList.add('dark');
        } else {
          root.classList.remove('dark');
        }
        localStorage.setItem('dimma_theme', theme);
      }, [theme]);

      const toggleTheme = () => {
        setTheme(prev => (prev === 'light' ? 'dark' : 'light'));
      };

      useEffect(() => {
        if (window.lucide && typeof window.lucide.createIcons === 'function') {
          window.lucide.createIcons();
        }
      });

      useEffect(() => {
        if (isChatOpen && chatEndRef.current) {
          chatEndRef.current.scrollIntoView({ behavior: 'smooth' });
        }
      }, [chatMessages, isBotTyping, isChatOpen]);

      const navigate = (page, extraData) => {
        setCurrentPage(page);
        setMobileMenuOpen(false);
        window.location.hash = `#/${page}`;
        if (extraData?.article) setSelectedArticle(extraData.article);
        else if (page !== 'blog') setSelectedArticle(null);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const handleSendMessage = (textToSend) => {
        const messageText = textToSend || chatInput;
        if (!messageText.trim()) return;

        const userMsg = {
          id: `user-${Date.now()}`,
          sender: 'user',
          text: messageText,
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        };

        setChatMessages(prev => [...prev, userMsg]);
        setChatInput('');
        setIsBotTyping(true);

        setTimeout(() => {
          const botResult = generateAiResponse(messageText, navigate);
          const botMsg = {
            id: `bot-${Date.now()}`,
            sender: 'bot',
            text: botResult.text,
            type: botResult.type,
            action: botResult.action,
            time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
          };
          setChatMessages(prev => [...prev, botMsg]);
          setIsBotTyping(false);
        }, 600);
      };

      return (
        <div className="flex flex-col min-h-screen text-slate-800 dark:text-slate-100 bg-slate-50 dark:bg-slate-950 transition-colors duration-300">
          <header className="sticky top-0 z-40 bg-white/95 dark:bg-slate-900/95 backdrop-blur-md shadow-sm border-b border-slate-100 dark:border-slate-800">
            <div className="max-w-7xl mx-auto px-4 flex items-center justify-between h-16">
              <button onClick={() => navigate('home')} className="flex items-center gap-2 font-bold text-brand-900 dark:text-brand-300">
                <span>🏥 DIMMA HOSPITAL &amp; MATERNITY</span>
              </button>
              <div className="flex items-center gap-2">
                <button onClick={() => navigate('appointment')} className="bg-brand-700 text-white px-4 py-2 rounded-xl text-xs font-bold">Book Visit</button>
              </div>
            </div>
          </header>

          <main className="flex-grow max-w-7xl mx-auto px-4 py-12 text-center space-y-4">
            <h1 className="text-3xl font-extrabold">DIMMA Hospital &amp; Maternity Portal</h1>
            <p className="text-slate-600 dark:text-slate-300">Complete responsive healthcare portal with Light/Dark theme and AI Assistant.</p>
          </main>

          {/* Fixed Floating Controls: Theme & AI Bot */}
          <div className="fixed bottom-20 right-3.5 md:bottom-6 md:right-6 z-50 flex flex-col items-end gap-3 pointer-events-auto">
            <button
              onClick={toggleTheme}
              title={`Switch to ${theme === 'light' ? 'Dark' : 'Light'} Mode`}
              className="w-12 h-12 rounded-2xl bg-white dark:bg-slate-800 text-slate-700 dark:text-amber-300 shadow-float border border-slate-200 dark:border-slate-700 flex items-center justify-center hover:scale-105 active:scale-95 transition-all"
            >
              {theme === 'light' ? '🌙' : '☀️'}
            </button>
            <button
              onClick={() => setIsChatOpen(!isChatOpen)}
              className="h-12 px-4 rounded-2xl bg-brand-700 hover:bg-brand-800 text-white font-bold shadow-float flex items-center gap-2 hover:scale-105 active:scale-95 transition-all"
            >
              <span>AI Health Assistant ✨</span>
            </button>
          </div>

          {/* AI Chatbot Popup */}
          {isChatOpen && (
            <div className="fixed bottom-24 right-3.5 md:bottom-22 md:right-6 z-50 w-[calc(100vw-1.75rem)] sm:w-[390px] h-[520px] max-h-[82vh] bg-white dark:bg-slate-900 rounded-3xl shadow-2xl border border-slate-200 dark:border-slate-800 flex flex-col overflow-hidden animate-fadeIn">
              <div className="bg-brand-900 p-4 text-white flex items-center justify-between">
                <span className="font-bold text-sm">DIMMA Health AI</span>
                <button onClick={() => setIsChatOpen(false)} className="font-bold">✕</button>
              </div>
              <div className="flex-grow p-4 overflow-y-auto space-y-3 text-xs bg-slate-50 dark:bg-slate-950">
                {chatMessages.map(msg => (
                  <div key={msg.id} className={`flex flex-col ${msg.sender === 'user' ? 'items-end' : 'items-start'}`}>
                    <div className={`p-3 rounded-xl max-w-[85%] ${msg.sender === 'user' ? 'bg-brand-700 text-white' : 'bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700'}`}>
                      {msg.text}
                      {msg.action && (
                        <div className="mt-2 pt-2 border-t border-slate-200 dark:border-slate-700">
                          {msg.action.href ? (
                            <a href={msg.action.href} className="px-3 py-1 bg-emergency-600 text-white font-bold rounded-lg inline-block text-[11px]">{msg.action.label}</a>
                          ) : (
                            <button onClick={() => { msg.action.onClick(); setIsChatOpen(false); }} className="px-3 py-1 bg-brand-700 text-white font-bold rounded-lg text-[11px]">{msg.action.label}</button>
                          )}
                        </div>
                      )}
                    </div>
                  </div>
                ))}
                {isBotTyping && <div className="text-xs text-slate-400">Typing...</div>}
                <div ref={chatEndRef} />
              </div>
              <form onSubmit={e => { e.preventDefault(); handleSendMessage(); }} className="p-3 bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 flex gap-2">
                <input type="text" value={chatInput} onChange={e => setChatInput(e.target.value)} placeholder="Ask health or hospital question..." className="flex-grow text-xs p-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white" />
                <button type="submit" className="p-2.5 bg-brand-700 text-white rounded-xl font-bold text-xs">➤</button>
              </form>
            </div>
          )}

          <footer className="bg-slate-900 text-slate-400 py-8 text-center text-xs">
            © 2026 DIMMA Hospital &amp; Maternity. All rights reserved.
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
