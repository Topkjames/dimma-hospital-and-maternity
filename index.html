                  >
                    <div
                      className={`max-w-[86%] p-3.5 rounded-2xl leading-relaxed whitespace-pre-line ${
                        msg.sender === 'user'
                          ? 'bg-brand-700 text-white rounded-br-xs shadow-xs'
                          : msg.type === 'emergency'
                          ? 'bg-emergency-50 dark:bg-emergency-950/70 border border-emergency-300 dark:border-emergency-800 text-emergency-950 dark:text-emergency-200 rounded-bl-xs'
                          : 'bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 border border-slate-200 dark:border-slate-700 rounded-bl-xs shadow-xs'
                      }`}
                    >
                      {msg.text}

                      {/* Action Button inside Bot Message */}
                      {msg.action && (
                        <div className="mt-2.5 pt-2 border-t border-slate-100 dark:border-slate-700">
                          {msg.action.href ? (
                            <a
                              href={msg.action.href}
                              className="inline-block px-3 py-1.5 bg-emergency-600 hover:bg-emergency-700 text-white font-bold rounded-lg text-[11px] shadow-xs"
                            >
                              {msg.action.label}
                            </a>
                          ) : (
                            <button
                              onClick={() => {
                                msg.action.onClick();
                                setIsChatOpen(false);
                              }}
                              className="px-3 py-1.5 bg-brand-700 hover:bg-brand-800 text-white font-bold rounded-lg text-[11px] shadow-xs"
                            >
                              {msg.action.label}
                            </button>
                          )}
                        </div>
                      )}
                    </div>
                    <span className="text-[9px] text-slate-400 mt-1 px-1">{msg.time}</span>
                  </div>
                ))}

                {/* Typing Indicator */}
                {isBotTyping && (
                  <div className="flex items-center gap-1.5 bg-white dark:bg-slate-800 p-3 rounded-2xl border border-slate-200 dark:border-slate-700 w-20">
                    <span className="w-2 h-2 rounded-full bg-brand-600 animate-bounce"></span>
                    <span className="w-2 h-2 rounded-full bg-brand-600 animate-bounce [animation-delay:0.2s]"></span>
                    <span className="w-2 h-2 rounded-full bg-brand-600 animate-bounce [animation-delay:0.4s]"></span>
                  </div>
                )}
                <div ref={chatEndRef} />
              </div>

              {/* Quick Prompt Suggestion Chips */}
              <div className="p-2 bg-slate-100 dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 flex gap-1.5 overflow-x-auto no-scrollbar">
                {[
                  "📅 Book Appointment",
                  "🤰 Antenatal & Maternity",
                  "🚨 Emergency Signs",
                  "📍 Hospital Location",
                  "🕒 Visiting Hours"
                ].map((chip, idx) => (
                  <button
                    key={idx}
                    onClick={() => handleSendMessage(chip.replace(/^[^\s]+\s/, ''))}
                    className="shrink-0 text-[10px] font-semibold bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:bg-brand-50 dark:hover:bg-slate-700 px-2.5 py-1 rounded-full border border-slate-200 dark:border-slate-700 transition-colors"
                  >
                    {chip}
                  </button>
                ))}
              </div>

              {/* Chat Input Bar */}
              <form
                onSubmit={(e) => {
                  e.preventDefault();
                  handleSendMessage();
                }}
                className="p-3 bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 flex items-center gap-2"
              >
                <input
                  type="text"
                  value={chatInput}
                  onChange={(e) => setChatInput(e.target.value)}
                  placeholder="Describe symptoms or ask hospital question..."
                  className="flex-grow text-xs p-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white focus:outline-none focus:ring-1 focus:ring-brand-500"
                />
                <button
                  type="submit"
                  disabled={!chatInput.trim()}
                  className="p-2.5 rounded-xl bg-brand-700 hover:bg-brand-800 disabled:opacity-40 text-white font-bold text-xs shrink-0 transition-all"
                >
                  ➤
                </button>
              </form>

            </div>
          )}

          {/* =========================================================================
              MAIN FOOTER
          ========================================================================== */}
          <footer className="bg-slate-900 dark:bg-slate-950 text-slate-300 py-12 px-4 sm:px-6 lg:px-8 border-t border-slate-800">
            <div className="max-w-7xl mx-auto grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8 text-xs">
              
              {/* Brand Col */}
              <div className="space-y-3 sm:col-span-2 lg:col-span-1">
                <div className="flex items-center gap-2.5">
                  <div className="w-10 h-10 rounded-xl bg-white p-1 flex items-center justify-center shrink-0">
                    <img
                      src="./public/assets/dimma-logo.jpg"
                      alt="DIMMA Logo"
                      className="w-full h-full object-contain"
                      onError={(e) => {
                        e.target.onerror = null;
                        e.target.src = './src/assets/dimma-logo.jpg';
                      }}
                    />
                  </div>
                  <div>
                    <span className="font-extrabold text-white text-sm block">DIMMA HOSPITAL</span>
                    <span className="text-[10px] font-bold text-emergency-500 uppercase">&amp; MATERNITY</span>
                  </div>
                </div>
                <p className="italic text-amber-300 text-xs font-semibold">"{siteConfig.tagline}"</p>
                <p className="text-slate-400 leading-relaxed">
                  Registered under Corporate Affairs Commission Nigeria (CAC RC: {siteConfig.cac}). Dedicated to safe maternal care, pediatric wellness, and primary healthcare.
                </p>
              </div>

              {/* Quick Navigation Col */}
              <div>
                <h4 className="font-bold text-white uppercase text-xs mb-3 tracking-wider">Hospital Wings</h4>
                <div className="flex flex-col space-y-2 text-slate-400">
                  <button onClick={() => navigate('home')} className="text-left hover:text-white transition-colors">Home Page</button>
                  <button onClick={() => navigate('about')} className="text-left hover:text-white transition-colors">About Us &amp; Philosophy</button>
                  <button onClick={() => navigate('services')} className="text-left hover:text-white transition-colors">12 Hospital Services</button>
                  <button onClick={() => navigate('maternity')} className="text-left hover:text-white transition-colors">Maternity &amp; Antenatal Wing</button>
                  <button onClick={() => navigate('doctors')} className="text-left hover:text-white transition-colors">Medical Specialists</button>
                </div>
              </div>

              {/* Patient Guidelines Col */}
              <div>
                <h4 className="font-bold text-white uppercase text-xs mb-3 tracking-wider">Patient Care</h4>
                <div className="flex flex-col space-y-2 text-slate-400">
                  <button onClick={() => navigate('patient-info')} className="text-left hover:text-white transition-colors">Patient Visit Guidelines</button>
                  <button onClick={() => navigate('appointment')} className="text-left hover:text-white transition-colors">Book an Appointment</button>
                  <button onClick={() => navigate('faq')} className="text-left hover:text-white transition-colors">Frequently Asked Questions</button>
                  <button onClick={() => navigate('blog')} className="text-left hover:text-white transition-colors">Health &amp; Maternity Articles</button>
                  <button onClick={() => navigate('contact')} className="text-left hover:text-white transition-colors">Emergency &amp; Directions</button>
                </div>
              </div>

              {/* Contact Information Col */}
              <div className="space-y-2.5 text-slate-400">
                <h4 className="font-bold text-white uppercase text-xs mb-3 tracking-wider">Direct Hospital Desk</h4>
                <p className="leading-relaxed">📍 {siteConfig.address.full}</p>
                <p>📞 <a href={siteConfig.phoneTel} className="text-white font-bold hover:underline">{siteConfig.phone}</a></p>
                <p>✉️ <a href={siteConfig.emailMailto} className="text-white hover:underline">{siteConfig.email}</a></p>
                <p className="text-emerald-400 font-semibold pt-1">🕒 {siteConfig.operatingHours.emergency}</p>
              </div>

            </div>

            <div className="max-w-7xl mx-auto pt-8 mt-8 border-t border-slate-800 text-center text-xs text-slate-500 flex flex-col sm:flex-row items-center justify-between gap-2">
              <p>© 2026 {siteConfig.name}. All rights reserved.</p>
              <p>Trans-Ekulu, Enugu, Nigeria • RC: {siteConfig.cac}</p>
            </div>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
